[build-system]
# Setuptools version should match setup.py; wheel because pip will insert it noisily
requires = ["setuptools >= 61.0", "setuptools-scm"]
build-backend = 'setuptools.build_meta'

[project]
name = "bkbit"
authors = [
  { name="brain-bican-bkbit developers"},
]
description = "A library for using brain-bican data models"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "Apache 2.0"}
dependencies = [
    "linkml>=1.5",
    "pandas",
    "click",
    "schemasheets",
    "platformdirs",
    "rdflib",
    "requests",
    "tqdm",
    # ait2jsonld: reads .h5ad structure, remotely over range requests
    "h5py",
    "anndata",
    "fsspec",
    "aiohttp",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["bkbit*"]

[tool.setuptools.package-data]
"bkbit.utils.ncbi_taxonomy_data" = ["*.json.gz"]
# ait2jsonld emits JSON-LD against the generated context.
"bkbit.models" = ["*.context.jsonld"]

[project.scripts]
bkbit = "bkbit.cli:cli"

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
]
test = [
    "pytest",
]
docs = [
    "mkdocs-material"
]

all = [
    "bkbit[dev]",
    "bkbit[docs]",
    "bkbit[test]",
]

[project.urls]
"Homepage" = "https://github.com/brain-bican/bkbit"

[tool.setuptools_scm]
write_to = "bkbit/_version.py"

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*'
check-hidden = true
ignore-regex = 'KEGG\.BRITE|https://bioregistry\.io/kegg\.brite|https://mor\.nlm\.nih\.gov' # codespell:ignore
ignore-words-list = 'ans'
