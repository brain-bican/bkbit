classes:
  Cell:
    name: Cell
    description: A single cell observation in the taxonomy; corresponds to one row
      in the obs DataFrame of the h5ad file.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    slot_usage:
      id:
        name: id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.index
          note:
            tag: note
            value: 'explain: barcode_Cell_sample+barcode'
          source:
            tag: source
            value: ait
        description: Unique identifier for each individual cell.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: bican_biolink
        range: string
    attributes:
      cluster_id:
        name: cluster_id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.cluster_id
          note:
            tag: note
            value: String value; one per annotation level column; for object modeling
              derive via Cell.part_of_cluster → Cluster.annotated_as
          source:
            tag: source
            value: ait
        description: Human-readable cluster label for the cluster assigned to this
          cell at a given annotation level.
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      load_id:
        name: load_id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.load_id
          note:
            tag: note
            value: it should be pointing to BarcodedCellSample, and the slot name
              should also change; nhash id should be used
          source:
            tag: source
            value: ait
        description: Identifier for the sequencing library from which molecular measurements
          were derived.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      assay:
        name: assay
        annotations:
          ait_location:
            tag: ait_location
            value: obs.assay
          source:
            tag: source
            value: ait
        description: Human-readable sequencing modality (e.g. 10x 3' v3).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      assay_ontology_term_id:
        name: assay_ontology_term_id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.assay_ontology_term_id
          source:
            tag: source
            value: ait
        description: EFO ontology term for assay (e.g. EFO:0009922 for 10x 3' v3).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      anatomical_region:
        name: anatomical_region
        annotations:
          ait_location:
            tag: ait_location
            value: obs.anatomical_region
          source:
            tag: source
            value: ait
        description: Human-readable name for the anatomical region from which the
          cell was collected.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      anatomical_region_ontology_term_id:
        name: anatomical_region_ontology_term_id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.anatomical_region_ontology_term_id
          source:
            tag: source
            value: ait
        description: UBERON ontology term for anatomical region (e.g. UBERON:0000955
          for brain).
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      brain_region_ontology_term_id:
        name: brain_region_ontology_term_id
        annotations:
          ait_location:
            tag: ait_location
            value: obs.brain_region_ontology_term_id
          source:
            tag: source
            value: ait
        description: Brain atlas region ID from DHBA/HBA/MBA for the anatomical region.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: string
      suspension_type:
        name: suspension_type
        annotations:
          ait_location:
            tag: ait_location
            value: obs.suspension_type
          source:
            tag: source
            value: ait
        description: Whether the measurement was performed on intact cells, nuclei,
          or is not applicable.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: SuspensionType
      is_primary_data:
        name: is_primary_data
        annotations:
          ait_location:
            tag: ait_location
            value: obs.is_primary_data
          source:
            tag: source
            value: ait
        description: True if this is the canonical instance of this cellular observation;
          False for reanalysis or secondary views.
        in_subset:
        - obs
        - assigned_metadata
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: boolean
      part_of_cluster:
        name: part_of_cluster
        description: The cluster to which this cell has been assigned by the clustering
          algorithm.
        in_subset:
        - obs
        - annotations
        from_schema: https://w3id.org/brain-bican/cell-taxonomy
        range: Cluster
  CellTypeSet:
    name: CellTypeSet
    description: A named annotation level in the taxonomy hierarchy (e.g. Class, Subclass)
      grouping cell type taxons. May represent a taxonomic level or a neighborhood.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
    mixins:
    - ProvEntity
    slots:
    - id
    - name
    - order
    - has_parent
    - has_abbreviation
    slot_usage:
      id:
        name: id
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (key)
          source:
            tag: source
            value: both
        description: Unique identifier for this annotation level.
        in_subset:
        - uns
        - annotations
        from_schema: bican_biolink
        range: string
      name:
        name: name
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (key) / obs (column name)
          source:
            tag: source
            value: both
        description: Name of this annotation level used as column header in obs (e.g.
          Class, Subclass).
        in_subset:
        - obs
        - uns
        - annotations
        from_schema: bican_biolink
        range: string
      order:
        name: order
        annotations:
          ait_location:
            tag: ait_location
            value: uns.hierarchy (value)
          source:
            tag: source
            value: both
        description: Integer rank of this annotation level in the hierarchy; lower
          values are broader types.
        in_subset:
        - uns
        - annotations
        range: integer
      has_parent:
        name: has_parent
