  Abbreviation:
    name: Abbreviation
    description: Maps an abbreviation string to its decoded meaning. Optionally the
      abbreviation can be linked to one or more entities it denotes.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
    is_a: named thing
