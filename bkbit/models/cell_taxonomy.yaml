      for testing, analysis, inspection, investigation, demonstration, or trial use.
      [SIO]
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    aliases:
    - biospecimen
    - sample
    - biosample
    - physical sample
    exact_mappings:
    - OBI:0000747
    - SIO:001050
    is_a: physical entity
    mixins:
    - subject of investigation
    slots:
    - id
    - iri
    - type
    - name
    - description
    - has attribute
    - deprecated
    - provided by
    - xref
    - full name
    - synonym
    - information content
    - equivalent identifiers
    - named thing_category
    class_uri: biolink:MaterialSample
  thing with taxon:
    name: thing with taxon
    definition_uri: https://w3id.org/biolink/vocab/ThingWithTaxon
    description: A mixin that can be used on any entity that can be taxonomically
      classified. This includes individual organisms; genes, their products and other
      molecular entities; body parts; biological processes
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    mixin: true
    slots:
    - in taxon
    - in taxon label
    class_uri: biolink:ThingWithTaxon
  biological entity:
    name: biological entity
    definition_uri: https://w3id.org/biolink/vocab/BiologicalEntity
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    aliases:
    - bioentity
    narrow_mappings:
    - WIKIDATA:Q28845870
    - STY:T050
    - SIO:010046
    - STY:T129
    is_a: named thing
    abstract: true
    mixins:
    - thing with taxon
    slots:
    - id
    - iri
    - type
    - name
    - description
    - has attribute
    - deprecated
    - provided by
    - xref
    - full name
    - synonym
    - information content
    - equivalent identifiers
    - named thing_category
    - in taxon
    - in taxon label
    class_uri: biolink:BiologicalEntity
  genomic entity:
    name: genomic entity
    definition_uri: https://w3id.org/biolink/vocab/GenomicEntity
    in_subset:
    - translator_minimal
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    narrow_mappings:
    - STY:T028
    - GENO:0000897
    mixin: true
    slots:
    - has biological sequence
    class_uri: biolink:GenomicEntity
  chemical entity or gene or gene product:
    name: chemical entity or gene or gene product
    definition_uri: https://w3id.org/biolink/vocab/ChemicalEntityOrGeneOrGeneProduct
    description: A union of chemical entities and children, and gene or gene product.
      This mixin is helpful to use when searching across chemical entities that must
      include genes and their children as chemical entities.
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    mixin: true
    class_uri: biolink:ChemicalEntityOrGeneOrGeneProduct
  macromolecular machine mixin:
    name: macromolecular machine mixin
    definition_uri: https://w3id.org/biolink/vocab/MacromolecularMachineMixin
    description: A union of gene locus, gene product, and macromolecular complex.
      These are the basic units of function in a cell. They either carry out individual
      biological activities, or they encode molecules which do this.
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    mixin: true
    slots:
    - name
    slot_usage:
      name:
        name: name
        description: genes are typically designated by a short symbol and a full name.
          We map the symbol to the default display name and use an additional slot
          for full name
        range: symbol type
    class_uri: biolink:MacromolecularMachineMixin
  gene or gene product:
    name: gene or gene product
    id_prefixes:
    - CHEMBL.TARGET
    - IUPHAR.FAMILY
    definition_uri: https://w3id.org/biolink/vocab/GeneOrGeneProduct
    description: A union of gene loci or gene products. Frequently an identifier for
      one will be used as proxy for another
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    is_a: macromolecular machine mixin
    mixin: true
    slots:
    - macromolecular machine mixin_name
    class_uri: biolink:GeneOrGeneProduct
  gene:
    name: gene
    id_prefixes:
    - NCBIGene
    - ENSEMBL
    - HGNC
    - MGI
    - ZFIN
    - dictyBase
    - WB
    - WormBase
    - FB
    - RGD
    - SGD
    - PomBase
    - OMIM
    - KEGG.GENES
    - UMLS
    - Xenbase
    - AspGD
    - PHARMGKB.GENE
    definition_uri: https://w3id.org/biolink/vocab/Gene
    description: A region (or regions) that includes all of the sequence elements
      necessary to encode a functional transcript. A gene locus may include regulatory
      regions, transcribed regions and/or other functional sequence regions.
    in_subset:
    - translator_minimal
    - model_organism_database
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    exact_mappings:
    - SO:0000704
    - SIO:010035
    - WIKIDATA:Q7187
    - dcid:Gene
    narrow_mappings:
    - bioschemas:gene
    broad_mappings:
    - NCIT:C45822
    is_a: biological entity
    mixins:
    - gene or gene product
    - genomic entity
    - chemical entity or gene or gene product
    - physical essence
    - ontology class
    slots:
    - id
    - iri
    - type
    - name
    - description
    - has attribute
    - deprecated
    - provided by
    - full name
    - synonym
    - information content
    - equivalent identifiers
    - named thing_category
    - in taxon
    - in taxon label
    - symbol
    - xref
    - has biological sequence
    class_uri: biolink:Gene
  genome:
    name: genome
    definition_uri: https://w3id.org/biolink/vocab/Genome
    description: A genome is the sum of genetic material within a cell or virion.
    in_subset:
    - model_organism_database
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    exact_mappings:
    - SO:0001026
    - SIO:000984
    - WIKIDATA:Q7020
    close_mappings:
    - dcid:GenomeAssemblyUnit
    is_a: biological entity
    mixins:
    - genomic entity
    - physical essence
    - ontology class
    slots:
    - id
    - iri
    - type
    - name
    - description
    - has attribute
    - deprecated
    - provided by
    - xref
    - full name
    - synonym
    - information content
    - equivalent identifiers
    - named thing_category
    - in taxon
    - in taxon label
    - has biological sequence
    class_uri: biolink:Genome
  ProvActivity:
    name: ProvActivity
    description: An activity is something that occurs over a period of time and acts
      upon or with entities;  it may include consuming, processing, transforming,
      modifying, relocating, using, or generating entities.
    from_schema: https://identifiers.org/brain-bican/bican-prov-schema
    mixin: true
    slots:
    - used
    class_uri: prov:Activity
  ProvEntity:
    name: ProvEntity
    description: An entity is a physical, digital, conceptual, or other kind of thing
      with some fixed aspects;  entities may be real or imaginary.
    from_schema: https://identifiers.org/brain-bican/bican-prov-schema
    mixin: true
    slots:
    - was_derived_from
    - was_generated_by
    class_uri: prov:Entity
  VersionedNamedThing:
    name: VersionedNamedThing
    description: An iteration of the biolink:NamedThing class that stores metadata
      about the object's version.
    from_schema: https://identifiers.org/brain-bican/bican-core-schema
    is_a: named thing
    abstract: true
    slots:
    - version
    - revision_of
    slot_usage:
      version:
        name: version
        required: true
  checksum:
    name: checksum
    description: Checksum values associated with digital entities.
    from_schema: https://identifiers.org/brain-bican/bican-core-schema
    is_a: entity
    slots:
    - checksum algorithm
    attributes:
      value:
        name: value
        description: The checksum value obtained from a specific cryotographic hash
          function.
        from_schema: https://identifiers.org/brain-bican/bican-core-schema
  GeneAnnotation:
    name: GeneAnnotation
    description: Represents a single gene. Includes metadata about the gene, such
      as its molecular type and the genome annotation it was referenced from.
    from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
    is_a: gene
    slots:
    - molecular_type
    - source_id
    attributes:
      referenced_in:
        name: referenced_in
        description: The genome annotation that this gene was referenced from.
        from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
        required: true
        inlined: true
        any_of:
        - range: GenomeAnnotation
        - range: string
  GenomeAnnotation:
    name: GenomeAnnotation
    description: Represents a genome annotation. Includes metadata about the genome,
      such as its version and reference assembly.
    from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
    is_a: genome
    slots:
    - version
    - digest
    - content_url
    - authority
    attributes:
      reference_assembly:
        name: reference_assembly
        description: The reference genome assembly that this genome annotation was
          created from.
        from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
        required: true
        inlined: true
        any_of:
        - range: GenomeAssembly
        - range: string
  GenomeAssembly:
    name: GenomeAssembly
    description: Represents a genome assembly. A genome assembly is a computational
      representation of a genome sequence.
    from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
    is_a: named thing
    mixins:
    - thing with taxon
    slots:
    - version
    - strain
  AnnotationCollection:
    name: AnnotationCollection
    from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
    attributes:
      annotations:
        name: annotations
        from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
        range: GeneAnnotation
        multivalued: true
        inlined_as_list: true
      genome_annotations:
        name: genome_annotations
        from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
        range: GenomeAnnotation
        multivalued: true
        inlined_as_list: true
      genome_assemblies:
        name: genome_assemblies
        from_schema: https://identifiers.org/brain-bican/genome-annotation-schema
        range: GenomeAssembly
        multivalued: true
        inlined_as_list: true
    tree_root: true
  ImageDataset:
    name: ImageDataset
    description: 'An image dataset is versioned release of a multidimensional regular
      grid of measurements  and metadata required for a morphological representation
      of an entity such as an anatomical  structure (ref: OBI_0003327, RRID:SCR_006266)'
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: ImageDataset
        - range: string
    attributes:
      x_direction:
        name: x_direction
        description: A controlled vocabulary attribute defining the x axis direction
          in terms of anatomical  direction.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: ANATOMICAL_DIRECTION
      y_direction:
        name: y_direction
        description: A controlled vocabulary attribute defining the y axis direction
          in terms of anatomical  direction.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: ANATOMICAL_DIRECTION
      z_direction:
        name: z_direction
        description: A controlled vocabulary attribute defining the z axis direction
          in terms of anatomical  direction.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: ANATOMICAL_DIRECTION
      x_size:
        name: x_size
        description: The number of pixels/voxels (size) along the x axis.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: integer
        minimum_value: 1
      y_size:
        name: y_size
        description: The number of pixels/voxels (size) along the y axis.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: integer
        minimum_value: 1
      z_size:
        name: z_size
        description: The number of pixels/voxels (size) along the y axis.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: integer
        minimum_value: 1
      x_resolution:
        name: x_resolution
        description: The resolution (length / pixel) in along the x axis (numerical
          value part).
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: float
        structured_pattern:
          syntax: '{PositiveFloat}'
      y_resolution:
        name: y_resolution
        description: The resolution (length / pixel) in along the y axis (numerical
          value part).
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: float
        structured_pattern:
          syntax: '{PositiveFloat}'
      z_resolution:
        name: z_resolution
        description: The resolution (length / pixel) in along the z axis (numerical
          value part).
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: float
        structured_pattern:
          syntax: '{PositiveFloat}'
      unit:
        name: unit
        description: A controlled vocabulary attribute defining the length unit of
          the x, y, and z  resolution values.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: DISTANCE_UNIT
  AnatomicalSpace:
    name: AnatomicalSpace
    description: 'An anatomical space is versioned release of a mathematical space
      with a defined mapping  between the anatomical axes and the mathematical axes.
      An anatomical space may be defined by  a reference image chosen as the biological
      reference for an anatomical structure of interest  derived from a single or
      multiple specimens (ref: ILX:0777106, RRID:SCR_023499)'
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: AnatomicalSpace
        - range: string
    attributes:
      measures:
        name: measures
        description: Reference to the specific image dataset used to define the anatomical
          space.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ImageDataset
        - range: string
  ParcellationTerminology:
    name: ParcellationTerminology
    description: 'A parcellation terminology is a versioned release set of terms that
      can be used to label  annotations in an atlas, providing human readability and
      context and allowing communication  about brain locations and structural properties.
      Typically, a terminology is a set of  descriptive anatomical terms following
      a specific naming convention and/or approach to  organization scheme. The terminology
      may be a flat list of controlled vocabulary, a taxonomy  and partonomy, or an
      ontology (ref: ILX:0777107, RRID:SCR_023499)'
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: ParcellationTerminology
        - range: string
  ParcellationTermSet:
    name: ParcellationTermSet
    description: A parcellation term set is the set of parcellation terms within a
      specific parcellation terminology.  A parcellation term set belongs to one and
      only one parcellation terminology and each parcellation  term in a parcellation
      terminology belongs to one and only one term set.  If the parcellation terminology
      is a taxonomy, parcellation term sets can be used to represent  taxonomic ranks.
      For consistency, if the terminology does not have the notion of taxonomic ranks,  all
      terms are grouped into a single parcellation term set.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slots:
    - ordinal
    slot_usage:
      ordinal:
        name: ordinal
        description: Ordinal of the parcellation term set among other term sets within
          the context of the  associated parcellation terminology.
    attributes:
      part_of_parcellation_terminology:
        name: part_of_parcellation_terminology
        description: Reference to the parcellation terminology for which the parcellation
          term set partitions.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ParcellationTerminology
        - range: string
      has_parent_parcellation_term_set:
        name: has_parent_parcellation_term_set
        description: Reference to the parent parcellation term set for which the parcellation
          term set is a child  (lower taxonomic rank) of.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        any_of:
        - range: ParcellationTermSet
        - range: string
  ParcellationTerm:
    name: ParcellationTerm
    description: A parcellation term is an individual term within a specific parcellation
      terminology describing a  single anatomical entity by a persistent identifier,
      name, symbol and description.  A parcellation  term is a unique and exclusive
      member of a versioned release parcellation terminology. Although term  identifiers
      must be unique within the context of one versioned release of a parcellation
      terminology,  they can be reused in different parcellation terminology versions
      enabling the representation of  terminology updates and modifications over time.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slots:
    - ordinal
    slot_usage:
      ordinal:
        name: ordinal
        description: Ordinal of the parcellation term among other terms within the
          context of the associated  parcellation terminology.
    attributes:
      symbol:
        name: symbol
        description: Symbol representing a parcellation term.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
      part_of_parcellation_term_set:
        name: part_of_parcellation_term_set
        description: Reference to the parcellation term set for which the parcellation
          term is part of.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ParcellationTermSet
        - range: string
      has_parent_parcellation_term:
        name: has_parent_parcellation_term
        description: Reference to the parent parcellation term for which the parcellation
          term is a child ( spatially part) of
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        any_of:
        - range: ParcellationTerm
        - range: string
  ParcellationColorScheme:
    name: ParcellationColorScheme
    description: A parcellation color scheme is a versioned release color palette
      that can be used to visualize a  parcellation terminology or its related parcellation
      annotation. A parcellation terminology may  have zero or more parcellation color
      schemes and each color scheme is in context of a specific  parcellation terminology,
      where each parcellation term is assigned a hex color value. A parcellation  color
      scheme is defined as a part of one and only one parcellation terminology.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: ParcellationColorScheme
        - range: string
    attributes:
      subject_parcellation_terminology:
        name: subject_parcellation_terminology
        description: Reference to the parcellation terminology for which the parcellation
          color scheme is in  context of.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ParcellationTerminology
        - range: string
  ParcellationColorAssignment:
    name: ParcellationColorAssignment
    description: The parcellation color assignment associates hex color value to a
      parcellation term within a  versioned release of a color scheme. A parcellation
      term is uniquely denoted by a parcellation  term identifier and the parcellation
      terminology it belongs to.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    slots:
    - subject_parcellation_term
    attributes:
      part_of_parcellation_color_scheme:
        name: part_of_parcellation_color_scheme
        description: Reference to the parcellation color scheme for which the color
          assignment is part of.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ParcellationColorScheme
        - range: string
      color:
        name: color
        description: A string representing to hex triplet code of a color
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: string
        structured_pattern:
          syntax: '{ColorHexTriplet}'
  AnatomicalAnnotationSet:
    name: AnatomicalAnnotationSet
    description: 'An anatomical annotation set is a versioned release of a set of
      anatomical annotations anchored  in the same anatomical space that divides the
      space into distinct segments following some annotation  criteria or parcellation
      scheme. For example, the anatomical annotation set of 3D image based  reference
      atlases (e.g. Allen Mouse CCF) can be expressed as a set of label indices of
      single  multi-valued image annotations or as a set of segmentation masks (ref:
      ILX:0777108, RRID:SCR_023499)'
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: AnatomicalAnnotationSet
        - range: string
    attributes:
      parameterizes:
        name: parameterizes
        description: Reference to the anatomical space for which the anatomical annotation
          set is anchored
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: AnatomicalSpace
        - range: string
  ParcellationAnnotation:
    name: ParcellationAnnotation
    description: A parcellation annotation defines a specific segment of an anatomical
      space denoted by an internal  identifier and is a unique and exclusive member
      of a versioned release anatomical annotation set.  For example, in the case
      where the anatomical annotation set is a single multi-value image mask (e.g.
      Allen Mouse CCF), a specific annotation corresponds to a specific label index
      (internal identifier) in the mask.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    attributes:
      part_of_anatomical_annotation_set:
        name: part_of_anatomical_annotation_set
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: AnatomicalAnnotationSet
        - range: string
      internal_identifier:
        name: internal_identifier
        description: An identifier that uniquely denotes a specific parcellation annotation
          within the context of an anatomical annotation set
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
      voxel_count:
        name: voxel_count
        description: The number of voxels (3D pixels) spanned by the parcellation
          annotation (optional).
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        range: integer
        minimum_value: 0
  ParcellationAnnotationTermMap:
    name: ParcellationAnnotationTermMap
    description: The parcellation annotation term map table defines the relationship
      between parcellation annotations and parcellation terms.  A parcellation term
      is uniquely denoted by a parcellation term identifier and the parcellation terminology
      it belongs to.  A parcellation term can be spatially parameterized by the union
      of one or more parcellation annotations within a versioned  release of an anatomical
      annotation set. For example, annotations defining individual cortical layers
      in cortical region  R (R1, R2/3, R4, etc) can be combined to define the parent
      region R.
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    slots:
    - subject_parcellation_term
    attributes:
      subject_parcellation_annotation:
        name: subject_parcellation_annotation
        description: Reference to the parcellation annotation that is the subject
          of the association.
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: ParcellationAnnotation
        - range: string
  ParcellationAtlas:
    name: ParcellationAtlas
    description: 'A parcellation atlas is a versioned release reference used to guide
      experiments or deal with the spatial relationship between  objects or the location
      of objects within the context of some anatomical structure. An atlas is minimally
      defined by a notion  of space (either implicit or explicit) and an annotation
      set. Reference atlases usually have additional parts that make them  more useful
      in certain situations, such as a well defined coordinate system, delineations
      indicating the boundaries of various  regions or cell populations, landmarks,
      and labels and names to make it easier to communicate about well known and useful  locations
      (ref: ILX:0777109, RRID:SCR_023499).'
    from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
    is_a: VersionedNamedThing
    slot_usage:
      revision_of:
        name: revision_of
        any_of:
        - range: ParcellationAtlas
        - range: string
    attributes:
      has_anatomical_space:
        name: has_anatomical_space
        description: Reference to the anatomical space component of the parcellation
          atlas
        from_schema: https://identifiers.org/brain-bican/anatomical-structure-schema
        required: true
        any_of:
        - range: AnatomicalSpace
        - range: string
      has_anatomical_annotation_set:
        name: has_anatomical_annotation_set
        description: Reference to the anatomical annotation set component of the parcellation
          atlas
