    description: AIT assigned label to tag attributes representing tooling.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  analysis:
    name: analysis
    description: AIT assigned label to tag attributes representing analysis.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  X:
    name: X
    description: Location within anndata object that stores data.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  raw:
    name: raw
    description: Location within anndata object that stores data.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  obs:
    name: obs
    description: Location within anndata object that stores cell metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  obsm:
    name: obsm
    description: Location within anndata object that stores cell-shaped matrices.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  var:
    name: var
    description: Location within anndata object that stores gene metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  varm:
    name: varm
    description: Location within anndata object that stores gene-shaped metadata.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  uns:
    name: uns
    description: Location within anndata object that stores header and everything
      else.
    from_schema: https://w3id.org/brain-bican/cell-taxonomy
  model_organism_database:
    name: model_organism_database
    definition_uri: https://w3id.org/biolink/vocab/ModelOrganismDatabase
    description: Subset that is relevant for a typical Model Organism Database (MOD)
    from_schema: https://w3id.org/biolink/bican-biolink-schema
  translator_minimal:
    name: translator_minimal
    definition_uri: https://w3id.org/biolink/vocab/TranslatorMinimal
    description: Minimum subset of translator work
    from_schema: https://w3id.org/biolink/bican-biolink-schema
  samples:
    name: samples
    definition_uri: https://w3id.org/biolink/vocab/Samples
    description: Sample/biosample datamodel
    from_schema: https://w3id.org/biolink/bican-biolink-schema
  testing:
    name: testing
    definition_uri: https://w3id.org/biolink/vocab/Testing
    description: TBD
    from_schema: https://w3id.org/biolink/bican-biolink-schema
types:
  iri type:
    name: iri type
    description: An IRI
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    typeof: uriorcurie
    uri: xsd:string
  label type:
    name: label type
    description: A string that provides a human-readable name for an entity
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    typeof: string
    uri: xsd:string
  narrative text:
    name: narrative text
    description: A string that provides a human-readable description of something
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    typeof: string
    uri: xsd:string
  unit:
    name: unit
    id_prefixes:
    - UO
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    exact_mappings:
    - qud:Unit
    typeof: string
    uri: UO:0000000
  biological sequence:
    name: biological sequence
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    typeof: string
    uri: xsd:string
  symbol type:
    name: symbol type
    from_schema: https://w3id.org/biolink/bican-biolink-schema
    typeof: string
    uri: xsd:string
  string:
    name: string
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    description: a URI or a CURIE
    notes:
